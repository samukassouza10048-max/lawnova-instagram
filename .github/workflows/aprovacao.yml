name: Aprovação
on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: fila
  cancel-in-progress: false
jobs:
  aprovar:
    if: ${{ !github.event.issue.pull_request && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registrar aprovação ou cancelamento
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aprovar.py
      - name: Publicar na hora se o horário já passou
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase origin main
          python scripts/publicar.py
