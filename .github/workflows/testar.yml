name: Testar conexão com o Instagram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar token (não publica nada)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/testar_conexao.py
