name: Publicar no Instagram
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # a cada 15 min, fora dos minutos cheios (o GitHub atrasa/descarta mais no minuto 0)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fila
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar posts aprovados e vencidos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publicar.py
