name: Abrir revisão dos posts novos
on:
  push:
    branches: [main]
    paths: ["fila/**"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fila
  cancel-in-progress: false
jobs:
  revisao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abrir issue de revisão para cada post novo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/abrir_revisao.py
