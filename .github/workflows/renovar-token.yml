name: Renovar token do Instagram
on:
  schedule:
    - cron: "17 11 * * 1"   # toda segunda, 08:17 (Brasília)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - name: Renovar token (vale 60 dias)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/renovar_token.py
